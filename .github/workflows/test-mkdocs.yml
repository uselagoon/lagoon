name: Test mkdocs
on:
  push:
    branches:
      - 'docs/**'
      - 'mkdocs'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/test-mkdocs.yml'

jobs:
  mkdocs:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      -
        name: Install mkdocs and dependencies
        run: |
          pip install --upgrade pip
          pip install mkdocs
          pip install -r docs/requirements.txt
      -
        name: Check docs build ok in native mkdocs
        run: |
          mkdocs -V
          mkdocs build -s
      -
        name: Check docs build ok with amazee.io mkdocs image
        # squidfunk/mkdocs-material stopped bundling mkdocs-redirects in 9.8.0, and the amazee.io image
        # doesn't install it, so add it until the image does (keep in step with docs/serve in the Makefile).
        run: |
          docker run --rm ghcr.io/amazeeio/mkdocs-material -V
          docker run --rm -v ${PWD}:/docs --entrypoint sh ghcr.io/amazeeio/mkdocs-material \
            -c 'pip install -q mkdocs-redirects==1.2.2 && mkdocs build -s'
